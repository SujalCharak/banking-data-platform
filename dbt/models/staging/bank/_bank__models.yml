models:
  - name: stg_bank__transactions
    description: >
      Typed and normalised transactions. Handles two timestamp formats and decimal commas
      from the branch system. Unparseable values become null here and are rejected downstream.
    columns:
      - name: txn_id
        data_tests: [not_null]
      - name: direction
        data_tests:
          - accepted_values:
              arguments:
                values: ["DR", "CR"]
      - name: txn_type
        data_tests:
          - relationships:
              arguments:
                to: ref('transaction_types')
                field: txn_type

  - name: stg_bank__customers
    description: Typed customer change feed, one row per delivered version.
    columns:
      - name: customer_id
        data_tests: [not_null]
      - name: updated_at
        data_tests: [not_null]

  - name: stg_bank__accounts
    description: Typed account change feed, one row per delivered version.
    columns:
      - name: account_id
        data_tests: [not_null]
      - name: iban
        data_tests:
          - expression_is_true:
              arguments:
                expression: "{{ regex_full_match('iban', '[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}') }}"

  - name: stg_bank__merchants
    description: Latest delivered version of each merchant.
    columns:
      - name: merchant_id
        data_tests: [unique, not_null]

  - name: stg_bank__fx_rates
    description: Latest delivered rate per currency and business day.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [rate_date, currency]
    columns:
      - name: rate_to_eur
        data_tests:
          - not_null
          - within_range:
              arguments:
                min_value: 0.01
                max_value: 100

  - name: stg_bank__transactions_stream
    description: Typed transaction events from Kafka, one row per message.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [_kafka_topic, _kafka_partition, _kafka_offset]
