models:
  - name: dim_date
    description: Calendar from calendar_start to calendar_end.
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: dim_customer
    description: Customer dimension, SCD type 2. Join on customer_id with a valid_from / valid_to range for point in time attributes.
    columns:
      - name: customer_version_key
        data_tests: [unique, not_null]
      - name: segment
        data_tests:
          - accepted_values:
              arguments:
                values: [RETAIL, PRIVATE, BUSINESS]
      - name: risk_rating
        data_tests:
          - accepted_values:
              arguments:
                values: [LOW, MEDIUM, HIGH]
    data_tests:
      - expression_is_true:
          arguments:
            expression: "valid_to is null or valid_to > valid_from"

  - name: dim_account
    description: Current state of every account.
    columns:
      - name: account_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: account_type
        data_tests:
          - accepted_values:
              arguments:
                values: [CHECKING, SAVINGS, CREDIT_CARD]

  - name: dim_merchant
    description: Merchants with their reporting spend category.
    columns:
      - name: merchant_id
        data_tests: [unique, not_null]

  - name: fct_transactions
    description: >
      One row per unique transaction that passed validation. Incremental on load time,
      merged on txn_id, clustered by txn_date on Snowflake. Amounts are in account
      currency and in EUR at the daily reference rate.
    columns:
      - name: txn_id
        data_tests: [unique, not_null]
      - name: account_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_id
      - name: amount
        data_tests:
          - not_null
          - within_range:
              arguments:
                min_value: 0.01
      - name: fx_rate_to_eur
        data_tests: [not_null]
      - name: txn_category
        data_tests: [not_null]
      - name: merchant_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_merchant')
                field: merchant_id
      - name: warning_reason
        data_tests:
          - accepted_values:
              arguments:
                values: [MISSING_MERCHANT]
    data_tests:
      - expression_is_true:
          arguments:
            expression: "{{ dbt.datediff('fx_rate_published_date', 'txn_date', 'day') }} <= {{ var('fx_max_staleness_days') }}"
      - expression_is_true:
          arguments:
            expression: "txn_ts <= _loaded_at"

  - name: fct_account_daily_balance
    description: >
      End of day balance per account, from the later of account opening and data start
      until closure. Incremental runs rebuild only from the earliest newly loaded transaction date.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [account_id, balance_date]
    columns:
      - name: closing_balance
        data_tests: [not_null]
      - name: closing_balance_eur
        data_tests: [not_null]

  - name: rpt_monthly_customer_summary
    description: Customer by month view of income, spend, flows and balances, with segment and risk rating as of month end.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [customer_id, month_start]
    columns:
      - name: segment
        data_tests: [not_null]

  - name: rpt_merchant_category_spend
    description: Monthly card spend by category and merchant country, net of reversed payments.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [month_start, spend_category, merchant_country]

  - name: rpt_aml_alerts
    description: >
      One row per AML alert. Structuring and velocity alerts group overlapping windows so a
      burst of activity produces one alert, not one per transaction.
    columns:
      - name: alert_id
        data_tests: [unique, not_null]
      - name: customer_risk_rating_at_alert
        data_tests: [not_null]
      - name: severity
        data_tests:
          - accepted_values:
              arguments:
                values: [HIGH, MEDIUM, LOW]

  - name: dq_rejected_transactions
    description: Quarantine of rows that failed validation, kept with their raw values for investigation and replay.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [_source_file, _source_row]

  - name: dq_transaction_file_summary
    description: One row per delivered transaction file with volumes, duplicates, rejections by reason and late arrivals.
    columns:
      - name: source_file
        data_tests: [unique, not_null]
      - name: file_date
        data_tests: [not_null]

  - name: dq_stream_vs_batch
    description: >
      For each transaction date seen on the Kafka stream, how many transactions arrived by stream, by daily
      extract, or both. batch_only rows are usually transactions the source delivered late, after the replayed files.
    columns:
      - name: txn_date
        data_tests: [unique, not_null]
      - name: stream_only
        data_tests:
          - within_range:
              arguments:
                max_value: 0
              config:
                severity: warn

unit_tests:
  - name: resent_copy_scanned_first_is_still_the_duplicate
    description: On Snowflake files in one COPY get their own scan times, so a resent copy can have an earlier _loaded_at than the original.
    model: dq_transaction_file_summary
    given:
      - input: ref('int_transactions__validated')
        rows:
          - {txn_id: T1, txn_ts: "2025-01-01 12:00:00", _source_file: transactions/transactions_20250102.csv.gz, _source_row: 5, _loaded_at: "2025-06-01 10:00:09"}
          - {txn_id: T1, txn_ts: "2025-01-01 12:00:00", _source_file: transactions/transactions_20250103.csv.gz, _source_row: 2, _loaded_at: "2025-06-01 10:00:01"}
    expect:
      rows:
        - {source_file: transactions/transactions_20250102.csv.gz, duplicate_rows: 0, late_arriving_rows: 0}
        - {source_file: transactions/transactions_20250103.csv.gz, duplicate_rows: 1, late_arriving_rows: 0}

  - name: stream_and_batch_are_compared_only_on_streamed_days
    model: dq_stream_vs_batch
    given:
      - input: ref('stg_bank__transactions_stream')
        rows:
          - {txn_id: T1, txn_ts: "2025-12-01 09:00:00"}
          - {txn_id: T2, txn_ts: "2025-12-01 10:00:00"}
          - {txn_id: T2, txn_ts: "2025-12-01 10:00:00"}
      - input: ref('stg_bank__transactions')
        rows:
          - {txn_id: T1, txn_ts: "2025-12-01 09:00:00"}
          - {txn_id: T3, txn_ts: "2025-12-01 11:00:00"}
          - {txn_id: T4, txn_ts: "2025-12-02 08:00:00"}
    expect:
      rows:
        - {txn_date: 2025-12-01, streamed_txns: 2, batch_txns: 2, in_both: 1, stream_only: 1, batch_only: 1}
