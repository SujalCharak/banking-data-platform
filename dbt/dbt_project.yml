name: bank_platform
version: "1.0.0"
config-version: 2
profile: bank_platform

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

clean-targets: ["target", "dbt_packages"]

vars:
  calendar_start: "2015-01-01"
  calendar_end: "2030-12-31"
  incremental_lookback_hours: 3
  fx_forward_fill_days: 7
  fx_max_staleness_days: 4
  aml_structuring_floor_eur: 9000
  aml_structuring_ceiling_eur: 10000
  aml_structuring_min_deposits: 3
  aml_structuring_window_hours: 24
  aml_velocity_window_minutes: 60
  aml_velocity_min_payments: 10
  aml_outlier_min_history: 20
  aml_outlier_min_zscore: 5.0
  aml_outlier_min_amount_eur: 1000
  enable_search_optimization: false
  enable_masking: false

models:
  bank_platform:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      core:
        +schema: core
      finance:
        +schema: finance
      risk:
        +schema: risk
      data_quality:
        +schema: data_quality

seeds:
  bank_platform:
    +schema: reference

snapshots:
  bank_platform:
    +schema: snapshots

data_tests:
  bank_platform:
    +store_failures: false
